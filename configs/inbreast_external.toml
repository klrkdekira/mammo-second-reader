# Cold external evaluation on INbreast.
#
# Nothing in this experiment is fitted on INbreast. The checkpoint, the Youden
# threshold, the 80%-validation-specificity threshold and the calibration
# temperature are all transferred unchanged from the frozen CBIS-DDSM run named
# in `internal_run`, so the result measures generalisation rather than a new
# training setting.
#
# Pre-registered before any external prediction was read:
#   * Label rule: BI-RADS 4a/4b/4c/5/6 malignant, 1/2/3 benign, no exclusions
#     (410 images, 108 patients, 24.4% prevalence).
#   * Primary subset: the full set.
#   * Secondary subset: lesion-present only, dropping the 67 BI-RADS 1 normals
#     (343 images, 29.2% prevalence), which separates imaging domain shift from
#     the case-mix shift caused by CBIS-DDSM containing no normal images.
# Both subsets and the rule are recorded in data/inbreast/manifest/manifest-lock.json.
#
# INbreast labels are radiological assessments, not biopsy-confirmed pathology,
# so the external target is a related but different construct from the training
# labels. Results are written to results/external/ and never merged into
# results/metrics.json, leaving the internal version 3 freeze intact.
run_name = "vgg16_imagenet_448__inbreast_cold"
internal_config = "configs/vgg16_highres_448.toml"
internal_run = "vgg16_imagenet_448"
dataset = "inbreast"

[data]
manifest = "data/inbreast/manifest/test.csv"
lesion_present_manifest = "data/inbreast/manifest/test_lesion_present.csv"
manifest_lock = "data/inbreast/manifest/manifest-lock.json"
image_root = "data/inbreast/cache_448"
image_size = 448
batch_size = 16
num_workers = 2
