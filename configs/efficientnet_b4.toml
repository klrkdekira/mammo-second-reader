seed = 42
run_name = "efficientnet_b4_imagenet"
output_dir = "models"

[data]
train_csv = "manifests/cbis-ddsm/train.csv"
val_csv = "manifests/cbis-ddsm/val.csv"
test_csv = "manifests/cbis-ddsm/test.csv"
image_root = "data/cbis-ddsm/cbis_ddsm"
image_size = 224

[model]
name = "efficientnet_b4"

[train]
epochs = 25
batch_size = 16
scheduler = "cosine"
early_stop_patience = 10
