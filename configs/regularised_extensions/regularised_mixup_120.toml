# Longer-budget replication of regularised_mixup. The original run is retained.
seed = 42
run_name = "regularised_mixup_120"
output_dir = "models"

[data]
train_csv = "manifests/cbis-ddsm/train.csv"
val_csv = "manifests/cbis-ddsm/val.csv"
test_csv = "manifests/cbis-ddsm/test.csv"
image_root = "data/cbis-ddsm/cbis_ddsm"
image_size = 224

[model]
name = "deeper"
pretrained = false
dropout_conv = 0.1
dropout_head = 0.4

[train]
epochs = 120
batch_size = 32
lr = 3e-4
weight_decay = 1e-4
grad_clip = 1.0
scheduler = "plateau"
early_stop_patience = 15
mixup_alpha = 0.2
