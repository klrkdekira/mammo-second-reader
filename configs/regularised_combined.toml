# Everything at once: heavy augmentation + label smoothing + mixup,
# with AdamW, stronger weight decay, and higher dropout. Longer patience
# because heavier regularisation converges more slowly.
seed = 42
run_name = "regularised_combined"
output_dir = "models"

[data]
train_csv = "data/cbis-ddsm/training/train.csv"
val_csv = "data/cbis-ddsm/training/val.csv"
test_csv = "data/cbis-ddsm/training/test.csv"
image_root = "data/cbis-ddsm/cbis_ddsm"
image_size = 224
augment = "heavy"

[model]
name = "deeper"
pretrained = false
dropout_conv = 0.2
dropout_head = 0.5

[train]
epochs = 80
batch_size = 32
lr = 3e-4
optimiser = "adamw"
weight_decay = 5e-4
grad_clip = 1.0
scheduler = "plateau"
early_stop_patience = 20
label_smoothing = 0.1
mixup_alpha = 0.2
