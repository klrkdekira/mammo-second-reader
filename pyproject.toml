[project]
name = "mammo-second-reader"
version = "0.1.0"
description = "Auditable Deep Learning for Breast Cancer Screening"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.8",
    "click>=8.4.1",
    "grad-cam>=1.5.5",
    "gradio>=6.14.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.1.6",
    "matplotlib>=3.10.9",
    "numpy>=2.4.3",
    "opencv-python-headless>=4.13.0.92",
    "pandas>=3.0.2",
    "peft>=0.19.1",
    "pydicom>=3.0.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "ruff>=0.15.13",
    "types-seaborn>=0.13.2.20260728",
    "types-tqdm>=4.70.0.20260731",
]

[tool.uv]
package = true
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "albumentations.*",
    "cv2.*",
    "gradio.*",
    "peft.*",
    "pydicom.*",
    "pytorch_grad_cam.*",
    "sklearn.*",
    "torchvision.*",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# PyTorch wheels per backend

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm72"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

